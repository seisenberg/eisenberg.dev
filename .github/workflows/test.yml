name: Tests

# Runs on every pull request and on main. It never has access to secrets or cloud credentials:
# - the trigger is `pull_request` (not `pull_request_target`), so code from a fork runs with a
#   read-only token and no secrets;
# - permissions are read-only;
# - every action is pinned to a full commit SHA (Dependabot keeps the pins current).
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (typecheck, API tests, build, browser tests)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: eisenmail
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: eisenmail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eisenmail" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # the test harness uses this database instead of starting an embedded one
      EISENMAIL_TEST_DSN: postgresql://eisenmail:ci-only@127.0.0.1:5432/eisenmail_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One source of truth: the tests run on the Node version the container image is built from.
      # When Dependabot moves the image to a new Node, this job tests that version in the same PR.
      - name: Node version of the container image
        id: runtime
        run: |
          version=$(sed -n 's/^FROM node:\([0-9][0-9.]*\).*/\1/p' Dockerfile.node | head -n 1)
          test -n "$version"
          echo "node=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser end-to-end tests (production build, desktop and phone)
        run: npm run test:e2e
      - name: Known vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  python:
    name: Python (inbox lambda)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Python version the container image is built from (see the Node job).
      - name: Python version of the container image
        id: runtime
        run: |
          version=$(sed -n 's/^FROM python:\([0-9][0-9.]*\).*/\1/p' Dockerfile.python | head -n 1)
          test -n "$version"
          echo "python=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ steps.runtime.outputs.python }}
          working-directory: py
      # --locked: exactly the versions in py/uv.lock, and a failure if the lock file does not
      # match pyproject.toml. The container image is built from the same lock file.
      - run: uv sync --locked
        working-directory: py
      - run: uv run --locked pytest -q
        working-directory: py

  images:
    name: Container images build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.node
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.python
          push: false
          cache-from: type=gha,scope=inbox
          cache-to: type=gha,scope=inbox,mode=max

  infra:
    name: Infrastructure templates and scripts lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false # one small tool, nothing worth caching
      - run: uvx --from 'cfn-lint==1.*' cfn-lint infra/*.yml
      - name: Shell scripts
        run: bash -n infra/db-host.sh && shellcheck infra/db-host.sh
