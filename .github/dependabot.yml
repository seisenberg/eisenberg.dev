# Keeps every dependency surface current: npm, Python, the container base images and the pinned
# GitHub Actions.
#
# Every pull request runs the full Tests and CodeQL workflows, so updates are grouped to keep the
# number of runs down: at most ONE pull request per ecosystem per week, with every update type in
# it (major, minor and patch). Security fixes are grouped the same way, but are raised as soon as
# they are known instead of waiting for Monday.
#
# The price of grouping: one update that breaks the tests holds back the others in its pull
# request. Comment "@dependabot ignore <dependency> major version" on it (or "... this
# dependency") and Dependabot rebuilds the pull request without that update.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /py
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        applies-to: version-updates
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  # The base images carry the language runtimes (Node, Python). A new runtime version is proposed
  # once it has been out for three weeks, and the Tests workflow then runs on that version,
  # because it reads the version from the Dockerfiles. Odd Node majors never become long-term
  # releases, so they are skipped. The Debian release in the tag (trixie) is changed by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 21
    ignore:
      - dependency-name: node
        versions: ["27.x", "29.x", "31.x", "33.x"]
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
