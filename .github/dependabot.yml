# Keeps every dependency surface current: npm, Python, the container base images and the pinned
# GitHub Actions. Minor and patch updates arrive as one grouped pull request per ecosystem per
# week; majors arrive on their own so they can be read. Security updates are raised immediately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /py
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # The base images carry the language runtimes (Node, Python). A new runtime version is proposed
  # once it has been out for three weeks, and the Tests workflow then runs on that version,
  # because it reads the version from the Dockerfiles. Odd Node majors never become long-term
  # releases, so they are skipped. The Debian release in the tag (trixie) is changed by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 21
    ignore:
      - dependency-name: node
        versions: ["27.x", "29.x", "31.x", "33.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
